# Manual deploy of the Fly agent app (fly.agent.toml).
# Trigger: Actions → this workflow → Run workflow.
#
# Secrets (required):
#   FLY_API_TOKEN — Create a deploy token in Fly.io (e.g. `fly tokens create deploy`)
#   and store it as a GitHub Actions **repository secret** named FLY_API_TOKEN.
#   Never commit tokens or paste them into workflow files.
#
# Runtime config (production):
#   OPENEMR_BASE_URL and other sensitive app settings should be set on the Fly app
#   with `fly secrets set ...` (or the Fly dashboard), not as plaintext `env:` in
#   this workflow — avoids leaking production URLs/credentials in CI logs and YAML.

name: Fly agent (manual deploy)

on:
  workflow_dispatch:

# One deploy at a time: queue overlapping runs instead of canceling (safer for Fly).
concurrency:
  group: fly-agent-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Cap job runtime so a stuck flyctl deploy cannot burn Actions minutes indefinitely.
    steps:
      - uses: actions/checkout@v4

      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::Repository secret FLY_API_TOKEN is missing or empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Pinned release (not @master) for reproducible CI — bump when upgrading flyctl setup.
      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Sets Dockerfile OCI source label to this GitHub repo. If GitLab is canonical,
      # override per deploy: `fly deploy --config fly.agent.toml --build-arg IMAGE_SOURCE_URL=...`
      # or edit `[build.args]` in `fly.agent.toml`.
      - name: Deploy agent app to Fly.io
        run: flyctl deploy --config fly.agent.toml --build-arg IMAGE_SOURCE_URL=https://github.com/${{ github.repository }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
