# Manual full FK scan on synthetic CSV fixtures (~10s). Does not run on push/PR.
name: Validate sample patient fixtures

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full fixture FK validation
        run: python scripts/validate_sample_patient_fixtures.py
