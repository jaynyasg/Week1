# Offline agent test suite (no OpenEMR or LLM secrets).
# Live OpenEMR + optional remote agent smoke stays manual/local per README
# (`RUN_LIVE_OPENEMR_E2E`, `OPENEMR_BASE_URL`, …).
#
# Optional CI E2E: add a separate workflow with `workflow_dispatch` only, set
# repository secrets to match `.env.example`, then run:
#   RUN_LIVE_OPENEMR_E2E=1 python -m pytest agent/tests/integration/test_live_openemr_optional.py -q

name: Agent tests

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check agent
      - name: Ruff format (verify)
        run: ruff format --check agent

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Bound wall time so a stuck suite cannot hang the runner indefinitely.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run agent tests
        run: python -m pytest agent/tests deploy/tests -q --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-agent-deploy
          path: junit.xml

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (root requirements)
        run: pip-audit -r requirements.txt
      - name: pip-audit (agent image)
        run: pip-audit -r deploy/requirements-agent.txt

  npm-audit-chat-ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat-ui/package-lock.json
      - name: npm audit (chat-ui)
        working-directory: chat-ui
        run: |
          npm ci
          npm audit

  chat-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat-ui/package-lock.json
      - name: Install and build chat UI
        working-directory: chat-ui
        run: |
          npm ci
          npm run build
