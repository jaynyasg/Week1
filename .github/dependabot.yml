# Weekly dependency updates (pip + chat-ui npm).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/chat-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
