[pytest]
# Optional live OpenEMR / deployed-agent E2E (agent/tests/integration/test_live_openemr_optional.py):
# no custom @pytest.mark names—only asyncio and skipif. Enable with RUN_LIVE_OPENEMR_E2E=1 or
# RUN_LIVE_OPENEMR_TESTS=1, OPENEMR_BASE_URL, and OPENEMR_AUTHORIZATION or OPENEMR_BEARER_TOKEN;
# optional AGENT_BASE_URL for POST /agent/chat smoke. See that module's docstring.
testpaths = agent/tests
asyncio_mode = auto
pythonpath = .
