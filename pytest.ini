[pytest]
# Optional live OpenEMR / deployed-agent E2E (agent/tests/integration/test_live_openemr_optional.py):
# Enable with RUN_LIVE_OPENEMR_E2E=1 or RUN_LIVE_OPENEMR_TESTS=1, OPENEMR_BASE_URL, and
# OPENEMR_AUTHORIZATION or OPENEMR_BEARER_TOKEN; optional AGENT_BASE_URL. See that module's docstring.
#
# Marker ``eval``: optional latency/eval gates (e.g. test_latency_gate_optional.py with RUN_LATENCY_GATE=1).
# Fast local: ``python -m pytest agent/tests deploy/tests -q -m "not eval"`` (still runs deploy tests).
markers =
    eval: optional eval/latency gate tests (often combined with env vars)
    llm_eval: optional behavioral LLM / CSV-tool evals (mocked; may be grouped for selective runs)
testpaths = agent/tests
asyncio_mode = auto
pythonpath = .
