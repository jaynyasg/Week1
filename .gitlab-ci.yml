stages:
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

test:
  stage: test
  # Cap job duration so stuck pytest cannot run unbounded on shared runners.
  timeout: 20m
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install ruff
  script:
    - python -m ruff check agent
    - python -m ruff format --check agent
    - python -m pytest agent/tests deploy/tests -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml

dependency-audit:
  stage: test
  image: python:3.12
  allow_failure: true
  timeout: 15m
  before_script:
    - pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r requirements.txt
    - pip-audit -r deploy/requirements-agent.txt

npm-audit-chat-ui:
  stage: test
  image: node:20
  allow_failure: true
  timeout: 20m
  script:
    - cd chat-ui && npm ci && npm audit

latency-gate:
  stage: test
  image: python:3.12
  allow_failure: true
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
  variables:
    RUN_LATENCY_GATE: "1"
    OPENEMR_BASE_URL: "https://openemr.example.invalid"
    AGENT_LATENCY_GATE_MS: "5000"
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m pytest agent/tests/integration/test_latency_gate_optional.py -v --tb=short

# -----------------------------------------------------------------------------
# Optional: live OpenEMR E2E (real network; requires CI/CD variables — not default)
# -----------------------------------------------------------------------------
# Do not put tokens in the repo. In GitLab: Settings → CI/CD → Variables (masked,
# protected). Typical vars: RUN_LIVE_OPENEMR_E2E=1, OPENEMR_BASE_URL, and either
# OPENEMR_BEARER_TOKEN or OPENEMR_AUTHORIZATION. Optional: AGENT_BASE_URL for
# deployed agent smoke (see agent/tests/integration/test_live_openemr_optional.py).
#
# Uncomment the job below and use a scheduled pipeline and/or manual trigger:
#
# live-openemr-e2e:
#   stage: test
#   image: python:3.12
#   rules:
#     - if: $CI_PIPELINE_SOURCE == "schedule"
#     - when: manual
#       allow_failure: true
#   variables:
#     RUN_LIVE_OPENEMR_E2E: "1"
#   before_script:
#     - pip install --upgrade pip
#     - pip install -r requirements.txt
#   script:
#     - python -m pytest agent/tests/integration/test_live_openemr_optional.py -q
#
# -----------------------------------------------------------------------------
# Optional: Docker image build for Dockerfile.agent (off by default)
# -----------------------------------------------------------------------------
# GitLab.com shared runners do not provide a host Docker socket. To run
# `docker build` you usually need either Docker-in-Docker (`services: docker:dind`
# plus TLS/env setup) or a rootless/Kaniko-based build job. Uncomment and adapt
# only when your runner supports DinD, a privileged setup, or Kaniko — not all
# shared-runner configurations allow these.
#
# build-agent-image:
#   stage: test
#   image: docker:24-cli
#   services:
#     - docker:24-dind
#   variables:
#     DOCKER_TLS_CERTDIR: "/certs"
#   rules:
#     - when: manual
#       allow_failure: true
#   script:
#     - docker build -f Dockerfile.agent -t agent-scaffold:ci .
