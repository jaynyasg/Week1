# Separate FastAPI agent Fly app — not the OpenEMR stack (see root fly.toml).
#
# Deploy from repo root:
#   fly deploy --config fly.agent.toml
#
# Operations, secrets, and troubleshooting: deploy/README-fly-agent.md

app = "clinical-agent-scaffold"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.agent"
  ignorefile = ".dockerignore.agent"

# OCI label org.opencontainers.image.source (Dockerfile.agent ARG IMAGE_SOURCE_URL).
# Replace CHANGE_ME with your GitLab group/user (or pass --build-arg on deploy).
[build.args]
  IMAGE_SOURCE_URL = "https://gitlab.com/CHANGE_ME/Week1"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "get"
    timeout = "5s"
    path = "/agent/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
