# Local hooks: pip install pre-commit && pre-commit install
# See https://pre-commit.com
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^agent/
      - id: ruff-format
        files: ^agent/
  - repo: local
    hooks:
      - id: validate-sample-patient-fixtures-quick
        name: validate sample patient fixtures (quick)
        entry: python scripts/validate_sample_patient_fixtures.py --quick
        language: system
        pass_filenames: false
        always_run: true
